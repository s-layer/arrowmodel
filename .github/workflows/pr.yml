
name: PR Coverage Report

on:
  pull_request:
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  coverage:
    name: Report test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # rustup ships on the runner image. A branch-pinned action (dtolnay/rust-toolchain@stable)
      # broke lockfile verification whenever upstream force-pushed that branch.
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=src/arrowmodel --cov-report=xml --cov-report=term

      - name: Post coverage comment
        uses: MishaKav/pytest-coverage-comment@v1.8.0
        with:
          pytest-coverage-path: coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pruning
        if: always()
        run: uv cache prune --ci
